name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build (linux amd64)
        run: GOOS=linux GOARCH=amd64 go build -o dist/forgebe-linux-amd64 ./cmd/forgebe

      - name: Build (darwin amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o dist/forgebe-darwin-amd64 ./cmd/forgebe

      - name: Build (darwin arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o dist/forgebe-darwin-arm64 ./cmd/forgebe

      - name: Checksum
        run: cd dist && sha256sum forgebe-* > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: forgebe-binaries
          path: dist/*

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
